@if (occupation) {
  <div class="container">
    <form>
      <!-- title -->
      <div class="mb-4">
        <h2>Reservierung bearbeiten</h2>
      </div>
      <!-- Date and Time -->
      <div class="mb-4">
        <label class="form-label">Zeit:</label>
        <div class="flex gap-2">
          <div class="w-1/2">
            <input type="text"
                   name="date"
                   class="form-control"
                   [class.is-invalid]="fieldErrors?.has('date')"
                   [value]="getDate()"
                   size="8"
                   readonly/>
            <tch-field-error [fieldErrors]="fieldErrors" field="date"/>
          </div>
          <div class="w-1/2">
            <select class="form-control"
                    id="time"
                    [class.is-invalid]="fieldErrors?.has('start')"
                    [(ngModel)]="time"
                    name="time">
              @for (time of getTimes(); track time) {
                <option [value]="time">
                  {{ showTime(time) }}
                </option>
              }
            </select>
            <tch-field-error [fieldErrors]="fieldErrors" field="start"/>
          </div>
        </div>
      </div>
      <!-- court -->
      <div class="mb-4">
        <label class="form-label">Platz:</label>
        <div class="sm:w-1/3">
          <select class="form-control"
                  id="court"
                  [class.is-invalid]="fieldErrors?.has('court')"
                  [(ngModel)]="court"
                  name="court">
            @for (index of systemConfig.getCourtIndices(); track index) {
              <option [value]="index + 1">
                {{ systemConfig.getCourtName(index) }}
              </option>
            }
          </select>
          <tch-field-error [fieldErrors]="fieldErrors" field="court"/>
        </div>
      </div>
      <!-- occupation type -->
      <div class="mb-4">
        <label class="form-label">Typ:</label>
        <select id="type"
                name="type"
                class="form-control"
                [class.is-invalid]="fieldErrors?.has('type')"
                [(ngModel)]="type">
          @for (reservationType of types; track reservationType) {
            <option [value]="reservationType.type">
              {{ reservationType.name }}
            </option>
          }
        </select>
        <tch-field-error [fieldErrors]="fieldErrors" field="type"/>
      </div>
      <!-- occupation text -->
      <div class="mb-4">
        <label class="form-label">Text:</label>
        <input type="text"
               class="form-control"
               [class.is-invalid]="fieldErrors?.has('text')"
               [(ngModel)]="occupation.text"
               name="text"
               required/>
        <tch-field-error [fieldErrors]="fieldErrors" field="text"/>
      </div>
      <!-- duration -->
      <div class="mb-4">
        <label class="form-label">Dauer:</label>
        <div class="flex items-center gap-2">
          <div class="w-1/3">
            <input type="text"
                   class="form-control"
                   [class.is-invalid]="fieldErrors?.has('duration')"
                   [(ngModel)]="occupation.duration"
                   name="duration"
                   size="1"/>
            <tch-field-error [fieldErrors]="fieldErrors" field="duration"/>
          </div>
          <div>
            mal {{ systemConfig.durationUnitInMinutes }} Minuten
          </div>
        </div>
      </div>
      <!-- user-->
      <div class="mb-4">
        Angelegt von {{ occupation.reservation.user.name }}
        @if (occupation.reservation.user.email) {
          <a [href]="'mailto:'+occupation.reservation.user.email">
            {{ occupation.reservation.user.email }}</a>
        }
      </div>
      <!-- error -->
      <div class="mb-4">
        <tch-show-error
          [httpError]="httpError"
          [errorMessages]="errorMessages"
          [fieldErrors]="fieldErrors">
        </tch-show-error>
      </div>
      <!-- Buttons -->
      <div class="flex gap-2">
        @if (canEdit()) {
          <button (click)="onUpdate()" class="btn btn-primary">
            Speichern
          </button>
        }
        @if (canDelete()) {
          <button (click)="onDelete()" class="btn btn-outline-secondary">
            Löschen
          </button>
        }
        <button (click)="onBack()" class="btn btn-outline-secondary">
          Zurück
        </button>
      </div>
    </form>
  </div>
}
