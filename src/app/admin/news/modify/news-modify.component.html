<div class="container">
  <form>
    <div class="mb-4">
      <h2>Nachricht ändern</h2>
    </div>

    <!-- subject -->
    <div class="mb-4">
      <label class="form-label">Titel:</label>
      <input type="text" class="form-control" [class.is-invalid]="fieldErrors?.has('subject')" name="subject"
        [(ngModel)]="news.subject" required />
      <tch-field-error [fieldErrors]="fieldErrors" field="subject" />
    </div>

    <!-- text -->
    <div class="mb-4">
      <label class="form-label">Text:</label>
      <textarea rows="30" class="form-control" [class.is-invalid]="fieldErrors?.has('text')" name="text"
        [(ngModel)]="news.text"></textarea>
      <tch-field-error [fieldErrors]="fieldErrors" field="text" />
    </div>

    <!-- error -->
    <div class="mb-4">
      <tch-show-error [httpError]="httpError" [errorMessages]="errorMessages" [fieldErrors]="fieldErrors">
      </tch-show-error>
    </div>

    <!-- Buttons -->
    <div class="flex gap-2">
      <button (click)="onClick()" class="btn btn-primary">
        Nachricht speichern
      </button>
      <button (click)="cancel()" class="btn btn-outline-secondary">Zurück</button>
    </div>
  </form>
</div>
