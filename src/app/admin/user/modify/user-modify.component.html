@if (user) {
  <div class="container">
    <form>
      <div class="mb-4">
        <h2>Benutzer ändern</h2>
      </div>
      <div class="mb-4">
        <label class="form-label">Name:</label>
        <input type="text" class="form-control" name="name" [(ngModel)]="user.name" required [disabled]="!isAdmin" />
        <tch-field-error [fieldErrors]="fieldErrors" field="name"/>
      </div>
      <div class="mb-4">
        <label class="form-label">EMail:</label>
        <input type="email" class="form-control" name="email" [(ngModel)]="user.email" />
        <tch-field-error [fieldErrors]="fieldErrors" field="email"/>
      </div>
      <div class="mb-4">
        <label class="form-label">Password:</label>
        <input type="password" class="form-control" name="password" [(ngModel)]="user.password" required />
        <tch-field-error [fieldErrors]="fieldErrors" field="passowrd"/>
      </div>
      <div class="mb-4">
        <label class="form-label">Passwort bestätigen:</label>
        <input type="password" class="form-control" name="confirmPassword" [(ngModel)]="confirmPassword" required />
        <tch-field-error [fieldErrors]="fieldErrors" field="confirmPassword"/>
      </div>
      @if (isAdmin) {
        <div class="mb-4">
          <label class="form-label">Rolle:</label>
          <select class="form-control" id="role" [(ngModel)]="userRole" name="role">
            @for (role of roleValues; track role) {
              <option [value]="role">{{ role }}</option>
            }
          </select>
          <tch-field-error [fieldErrors]="fieldErrors" field="role"/>
        </div>
      }
      @if (isAdmin) {
        <div class="mb-4">
          <label class="form-label">Status:</label>
          <select class="form-control" id="status" [(ngModel)]="userStatus" name="status">
            @for (s of statusValues; track s) {
              <option [value]="s">{{ s }}</option>
            }
          </select>
          <tch-field-error [fieldErrors]="fieldErrors" field="status"/>
        </div>
      }
      <div class="mb-4">
        <tch-show-error
          [httpError]="httpError"
          [errorMessages]="errorMessages"
          [fieldErrors]="fieldErrors"
        ></tch-show-error>
      </div>
      <div class="flex gap-2">
        <button (click)="onClick()" class="btn btn-primary">
          Daten speichern
        </button>
        <button (click)="cancel()" class="btn btn-outline-secondary">Zurück</button>
      </div>
    </form>
  </div>
}
