@if (!qrUrl) {
  <div class="container">
    <form>
      <div class="mb-4">
        <tch-show-error [errorMessages]="errorMessages" [httpError]="httpError" [fieldErrors]="fieldErrors">
        </tch-show-error>
      </div>
      <div class="mb-4">
        <h2>Benutzer anlegen</h2>
      </div>
      <div class="mb-4">
        <label class="form-label">Name:</label>
        <div class="flex">
          <input [(ngModel)]="user.name" class="form-control" name="name" type="text" placeholder="vorname.zuname"/>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label">E-Mail:</label>
        <div class="flex">
          <input [(ngModel)]="user.email" class="form-control" name="email" type="email" />
        </div>
      </div>
      <div class="form-check-inline mb-4">
        <input class="form-check-input" type="radio" checked="checked" name="role" id="select_user"
               [(ngModel)]="user.role" [value]="UserRole.REGISTERED" selected>
        <label class="form-check-label" for="select_user">
          Mitglied
        </label>
      </div>
      <div class="form-check-inline">
        <input class="form-check-input" type="radio" name="role" id="select_guest" [(ngModel)]="user.role"
               [value]="UserRole.GUEST">
        <label class="form-check-label" for="select_guest">
          Gast
        </label>
      </div>

      <div class="mb-4 mt-2">
        <button [disabled]="!user.name || !user.email" (click)="onClickNewUser()" class="btn btn-outline-primary">
          Benutzer anlegen
        </button>
      </div>

      <div class="mt-12 mb-4">
        <h2>Kennwort zurücksetzen</h2>
      </div>
      <div class="mb-4">
        <label class="form-label">Benutzer:</label>
        <div class="flex items-start">
          <div class="w-full">
            <tch-select-filter [valueList]="activeUserNames" (selected)="onSelectUser($event)">
            </tch-select-filter>
          </div>
          <button [disabled]="!selectedUserId" (click)="onClickNewPassword()" class="btn btn-outline-primary ml-4">
            neues Passwort
          </button>
        </div>
      </div>
      <div>
        <button (click)="onClose()" class="btn btn-outline-secondary mt-1">Zurück</button>
      </div>
    </form>
  </div>
}
@if (qrUrl) {
  <div class="flex flex-col break-words items-center">
    <h2 class="mt-4">QR-Code</h2>
    <qrcode [qrdata]="qrUrl"></qrcode>
    <div class="mx-4 text-center">
      Dieser QR-Code enthält den Link zum Anmelden für den Benutzer
      <h4>{{ user.name }}</h4>
      <h6>{{ user.email }}</h6>
      mit dem generierten Kennwort
      <h4>{{ user.password }}</h4>
      <p>{{ qrUrl }}</p>
      <button class="btn btn-outline-secondary btn-sm my-4" (click)="onCopyToClipboard(qrUrl)">
        Link kopieren
      </button>
    </div>
    <button (click)="onClose()" class="btn btn-outline-primary my-12">Schließen</button>
  </div>
}
