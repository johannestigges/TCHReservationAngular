<div class="container" style="max-width: 20rem;">
  <h2>Anmeldung</h2>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    @if (error) {
      <div class="bg-red-600 text-white p-4 my-4 rounded">{{error}}</div>
    }
    <div class="mb-4">
      <label for="user" class="form-label">Benutzerkennung</label>
      <input formControlName="user"
             class="form-control"
             type="text"
             id="user"/>
    </div>
    <div class="mb-4">
      <label for="password" class="form-label">Kennwort</label>
      <input formControlName="password"
             class="form-control"
             type="password"
             id="password"/>
    </div>
    <div class="mb-4 flex items-center gap-2">
      <input formControlName="rememberMe"
             type="checkbox"
             id="rememberMe"
             class="form-check-input"/>
      <label for="rememberMe" class="form-label mb-0">Angemeldet bleiben</label>
    </div>
    <div class="flex gap-2">
      <button type="submit" class="btn btn-outline-primary">
        Anmelden
      </button>
      <button class="btn btn-outline-secondary" (click)="onCancel()">
        Abbrechen
      </button>
    </div>
  </form>
</div>
