<input type="text" class="form-control w-full p-4 mb-4" [value]="selectedValue"
  (input)="onInput($event)" (focus)="onFocus()">
@if (showList) {
  <ul class="list-group">
    @for (value of selectableValues; track value) {
      <li class="list-group-item list-group-item-action" [class.active]="value === selectedValue"
      (click)="onSelect(value)">{{value}}</li>
    }
  </ul>
}
